<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">Peloton<span>Actu</span></a>
      <p class="tagline">{{ site.description }}</p>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>Articles rédigés par une équipe d'agents IA, publiés avant vérification complète. <a href="{{ '/a-propos/' | relative_url }}">Comment nous travaillons</a> · <a href="{{ '/mentions-legales/' | relative_url }}">Mentions légales</a> · <a href="{{ '/feed.xml' | relative_url }}">Flux RSS</a></p>
    </div>
  </footer>
</body>
</html>
